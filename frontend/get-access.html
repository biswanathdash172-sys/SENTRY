<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SENTRY | Get Access</title>
  <meta name="description" content="Connect your organization to SENTRY using your organization ID and preset password." />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");

    :root {
      --bg: #0A0E27;
      --panel: #10142E;
      --accent: #3B5BFF;
      --accent-2: #22D3EE;
      --border: rgba(255,255,255,0.08);
      --text: #FFFFFF;
      --muted: #94A3B8;
      --ok: #22D3EE;
      --err: #ff6b6b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .brand span { font-weight: 800; letter-spacing: 0.1em; font-size: 1.1rem; }
    h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 6px; }
    p.sub { font-size: 0.85rem; color: var(--muted); margin-bottom: 24px; line-height: 1.5; }
    label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .field { margin-bottom: 18px; }
    input {
      width: 100%;
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s ease;
    }
    input:focus { border-color: var(--accent-2); }
    button {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 6px;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { font-size: 0.82rem; margin-top: 12px; display: none; line-height: 1.5; }
    .msg.error { color: var(--err); }
    .msg.success { color: var(--ok); }
    .footer { margin-top: 20px; text-align: center; font-size: 0.82rem; color: var(--muted); }
    .footer a { color: var(--accent-2); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#22D3EE" stroke-width="2">
        <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5" />
        <circle cx="12" cy="12" r="3.5" fill="#22D3EE" fill-opacity="0.25" stroke="#22D3EE" stroke-width="1.5" />
      </svg>
      <span>SENTRY</span>
    </div>

    <h1>Get Access</h1>
    <p class="sub">Enter your Organization ID and the preset organization password to connect your org to SENTRY.</p>

    <form id="access-form">
      <div class="field">
        <label for="org-id">Organization ID</label>
        <input type="text" id="org-id" placeholder="e.g. ACME-01" required autocomplete="off" />
      </div>
      <div class="field">
        <label for="org-password">Organization Password</label>
        <input type="password" id="org-password" placeholder="••••••••" required autocomplete="off" />
      </div>
      <button type="submit" id="submit-btn">Verify Organization</button>
      <div class="msg error" id="error-message"></div>
      <div class="msg success" id="success-message"></div>
    </form>

    <div class="footer">
      Already connected? <a href="/login">Sign in with your Employee ID</a>
    </div>
  </div>

  <script>
    const API_BASE = "";
    const form = document.getElementById("access-form");
    const submitBtn = document.getElementById("submit-btn");
    const errorEl = document.getElementById("error-message");
    const successEl = document.getElementById("success-message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.style.display = "none";
      successEl.style.display = "none";

      const orgId = document.getElementById("org-id").value.trim();
      const orgPassword = document.getElementById("org-password").value;

      submitBtn.disabled = true;
      submitBtn.textContent = "Verifying…";

      try {
        const res = await fetch(`${API_BASE}/access/verify-org`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ org_id: orgId, org_password: orgPassword }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || "Could not verify this organization.");
        }

        const data = await res.json();
        sessionStorage.setItem("sentry_verified_org_id", data.org_id);
        sessionStorage.setItem("sentry_verified_org_name", data.org_name);

        successEl.textContent = `Organization "${data.org_name}" verified. Redirecting to sign in…`;
        successEl.style.display = "block";

        setTimeout(() => { window.location.href = "/login"; }, 1200);
      } catch (err) {
        errorEl.textContent = err.message || "Verification failed.";
        errorEl.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Verify Organization";
      }
    });
  </script>
</body>
</html>
