<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SENTRY | Employee Sign In</title>
  <meta name="description" content="Sign in to SENTRY with your organization-issued Employee ID." />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
    @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&display=swap");

    :root {
      --bg: #0A0E27;
      --panel: #10142E;
      --accent: #3B5BFF;
      --accent-2: #22D3EE;
      --border: rgba(255,255,255,0.08);
      --text: #FFFFFF;
      --muted: #94A3B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background: url('assets/login-page-bg.jpeg') center center / cover no-repeat, var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: block;
    }

    /* Right-side card wrapper — fixed, vertically centered */
    .card-wrapper {
      position: fixed;
      top: 47%;
      right: 14%;
      transform: translateY(-50%);
      z-index: 1;
      width: 380px;
    }

    /* Page header above the card */
    .page-header {
      margin-bottom: 20px;
      text-align: left;
    }
    .page-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: var(--accent-2);
    }
    .page-subtitle {
      font-size: 0.95rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Dark overlay on top of background image */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(10, 14, 39, 0.40);
      z-index: 0;
      pointer-events: none;
    }

    /* Card entrance animation */
    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      background: rgba(16, 20, 46, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(59, 91, 255, 0.25);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(34,211,238,0.08);
      animation: cardFadeIn 0.8s cubic-bezier(0.16,1,0.3,1) forwards;
      opacity: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .brand span {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    p.sub {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .field { margin-bottom: 18px; }
    input {
      width: 100%;
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s ease;
    }
    input:focus { border-color: var(--accent-2); }
    button {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 6px;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error {
      display: none;
      color: #ff6b6b;
      font-size: 0.8rem;
      margin-top: 10px;
    }
    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .footer a { color: var(--accent-2); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card-wrapper">
    <div class="page-header">
      <h1 class="page-title">SENTRY</h1>
      <p class="page-subtitle">Human-Governed Autonomous SOC</p>
    </div>

    <div class="card">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#22D3EE" stroke-width="2">
          <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5" />
          <circle cx="12" cy="12" r="3.5" fill="#22D3EE" fill-opacity="0.25" stroke="#22D3EE" stroke-width="1.5" />
        </svg>
        <span>SENTRY</span>
      </div>

      <h1>Employee Sign In</h1>
      <p class="sub">Use the Employee ID and password your organization gave you.</p>

      <form id="login-form">
        <div class="field">
          <label for="employee-id">Employee ID</label>
          <input type="text" id="employee-id" placeholder="e.g. EMP-0231" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" id="submit-btn">Sign In</button>
        <div class="error" id="error-message"></div>
      </form>

      <div class="footer">
        Organization not connected yet? <a href="/get-access">Get Access</a>
      </div>
    </div>
  </div>

  <script>
    const API_BASE ="";
    const form = document.getElementById("login-form");
    const submitBtn = document.getElementById("submit-btn");
    const errorEl = document.getElementById("error-message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.style.display = "none";

      const employeeId = document.getElementById("employee-id").value.trim();
      const password = document.getElementById("password").value;

      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in…";

      try {
        const body = new URLSearchParams();
        body.set("employee_id", employeeId);
        body.set("password", password);

        const res = await fetch(`${API_BASE}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body,
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || "Invalid Employee ID or password.");
        }

        const data = await res.json();
        sessionStorage.setItem("sentry_token", data.token);
        sessionStorage.setItem("sentry_org_id", data.org_id);
        sessionStorage.setItem("sentry_employee_id", data.employee_id);
        window.location.href = "/dashboard";
      } catch (err) {
        errorEl.textContent = err.message || "Sign in failed.";
        errorEl.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
